<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Trendy Clothing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg, #e3f2fd, #fce4ec);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 15px;
}

/* Container */
.contact-container{
    background:white;
    width:100%;
    max-width:800px;
    padding:50px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.contact-container h2{
    text-align:center;
    font-size:30px;
    margin-bottom:10px;
    background:linear-gradient(to right, #2196f3, #e91e63);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.contact-container p{
    text-align:center;
    margin-bottom:35px;
    color:#666;
}

/* Grid */
.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-size:14px;
    margin-bottom:6px;
    font-weight:500;
    color:#444;
}

.form-group input,
.form-group textarea{
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:14px;
    background:#fafafa;
    transition:0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#2196f3;
    background:white;
    outline:none;
    box-shadow:0 0 8px rgba(33,150,243,0.2);
}

/* Full Width */
.full{
    grid-column:1 / -1;
}

/* Button */
button{
    width:100%;
    padding:14px;
    background:linear-gradient(to right, #2196f3, #e91e63);
    color:white;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* Responsive */
@media(max-width:650px){
    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>
<form onsubmit="return validateForm()">
<script>
function validateForm() {
    let inputs = document.querySelectorAll("input[required], textarea[required]");
    
    for (let input of inputs) {
        if (input.value.trim() === "") {
            alert("Please fill all required fields ❗");
            return false;
        }
    }

    let email = document.querySelector('input[type="email"]').value;
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (!email.match(emailPattern)) {
        alert("Please enter a valid email ❗");
        return false;
    }

    alert("✅ Your order has been successfully submitted!");

    document.querySelector("form").reset(); // clear form

    return false; // stop page reload
}
</script>
<script>
function validateForm() {

    let firstName = document.querySelector('input[placeholder="Enter first name"]').value;
    let lastName = document.querySelector('input[placeholder="Enter last name"]').value;
    let email = document.querySelector('input[type="email"]').value;

    if (firstName === "" || email === "") {
        alert("Please fill required fields ❗");
        return false;
    }

    // SAVE DATA
    let userData = {
        name: firstName + " " + lastName,
        email: email
    };

    localStorage.setItem("orderDetails", JSON.stringify(userData));

    alert("✅ Order Successfully Submitted!");

    document.querySelector("form").reset();

    return false;
}
</script>

<div class="contact-container">
    <h2>Contact Our Team</h2>
    <p>We’d love to hear from you 💌</p>

    <form>

        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter last name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full">
                <label>Subject</label>
                <input type="text" placeholder="Enter subject">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full">
                <label>Your Message</label>
                <textarea rows="4" placeholder="Write your message here..." required></textarea>
            </div>
        </div>

        <button type="submit">Send Message</button>

    </form>
</div>

</body>
</html>
